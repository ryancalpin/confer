name: Confer
options:
  bundleIdPrefix: io.github.ryancalpin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Confer:
    type: application
    platform: iOS
    sources:
      - path: Confer
    info:
      path: Confer/Resources/Info.plist
      properties:
        CFBundleDisplayName: Confer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Only when you tap “Share my location”, Confer sends your current position to the people you choose. It expires automatically."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.ryancalpin.confer.refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryancalpin.confer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  ConferUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConferUITests
    dependencies:
      - target: Confer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryancalpin.confer.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Confer:
    build:
      targets:
        Confer: all
        ConferUITests: [test]
    test:
      targets:
        - ConferUITests
